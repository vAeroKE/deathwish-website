<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeathWish Bot — The Ultimate Discord Raiding Bot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --purple-primary: #7B2FBE;
            --purple-light: #9D4EDD;
            --purple-dark: #5A1A8E;
            --purple-accent: #C77DFF;
            --purple-glow: rgba(155, 79, 221, 0.3);
            --white: #FFFFFF;
            --off-white: #FAFAFA;
            --gray-light: #F3F0F7;
            --gray: #8B8B8B;
            --gray-dark: #4A4A4A;
            --text-dark: #1A1A2E;
            --shadow-purple: 0 4px 20px rgba(123, 47, 190, 0.15);
            --shadow-soft: 0 2px 12px rgba(0, 0, 0, 0.06);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--off-white);
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(123, 47, 190, 0.1);
            padding: 16px 0;
            transition: var(--transition);
        }

        .navbar.scrolled {
            box-shadow: var(--shadow-purple);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.4rem;
            color: var(--purple-primary);
        }

        .nav-logo svg {
            width: 36px;
            height: 36px;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            align-items: center;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            font-size: 0.95rem;
            transition: var(--transition);
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--purple-primary);
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--purple-primary);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-cta {
            background: linear-gradient(135deg, var(--purple-primary), var(--purple-light));
            color: var(--white) !important;
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            font-weight: 600 !important;
            transition: var(--transition);
        }

        .nav-cta:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-purple);
        }

        .nav-cta::after {
            display: none;
        }

        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            flex-direction: column;
            gap: 5px;
            padding: 4px;
        }

        .mobile-toggle span {
            width: 24px;
            height: 2px;
            background: var(--purple-primary);
            border-radius: 2px;
            transition: var(--transition);
        }

        /* ===== HERO ===== */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 24px 80px;
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(155, 79, 221, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(199, 125, 255, 0.06) 0%, transparent 50%),
                var(--off-white);
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -10%;
            width: 60%;
            height: 200%;
            background: radial-gradient(ellipse, rgba(123, 47, 190, 0.04) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero-content {
            max-width: 800px;
            position: relative;
            z-index: 2;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(123, 47, 190, 0.08);
            border: 1px solid rgba(123, 47, 190, 0.2);
            color: var(--purple-primary);
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 28px;
        }

        .hero-badge .dot {
            width: 8px;
            height: 8px;
            background: #57F287;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -0.03em;
            margin-bottom: 24px;
            color: var(--text-dark);
        }

        .hero h1 .gradient {
            background: linear-gradient(135deg, var(--purple-primary), var(--purple-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--gray-dark);
            max-width: 600px;
            margin: 0 auto 40px;
            line-height: 1.7;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--purple-primary), var(--purple-light));
            color: var(--white);
            padding: 16px 36px;
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 16px rgba(123, 47, 190, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(123, 47, 190, 0.4);
        }

        .btn-secondary {
            background: var(--white);
            color: var(--purple-primary);
            padding: 16px 36px;
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 2px solid rgba(123, 47, 190, 0.2);
        }

        .btn-secondary:hover {
            border-color: var(--purple-primary);
            background: rgba(123, 47, 190, 0.04);
            transform: translateY(-3px);
        }

        .hero-stats {
            display: flex;
            gap: 48px;
            justify-content: center;
            margin-top: 64px;
            flex-wrap: wrap;
        }

        .hero-stat {
            text-align: center;
        }

        .hero-stat .number {
            font-size: 2rem;
            font-weight: 800;
            color: var(--purple-primary);
        }

        .hero-stat .label {
            font-size: 0.85rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 4px;
        }

        /* ===== SECTIONS ===== */
        section {
            padding: 100px 24px;
        }

        .section-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 64px;
        }

        .section-tag {
            display: inline-block;
            color: var(--purple-primary);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }

        .section-header h2 {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
            color: var(--text-dark);
        }

        .section-header p {
            color: var(--gray-dark);
            font-size: 1.1rem;
            max-width: 580px;
            margin: 0 auto;
        }

        /* ===== FEATURES GRID ===== */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
        }

        .feature-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 36px 32px;
            transition: var(--transition);
            border: 1px solid rgba(123, 47, 190, 0.08);
            position: relative;
            overflow: hidden;
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--purple-primary), var(--purple-accent));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }

        .feature-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-purple);
            border-color: rgba(123, 47, 190, 0.2);
        }

        .feature-card:hover::before {
            transform: scaleX(1);
        }

        .feature-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(123, 47, 190, 0.1), rgba(199, 125, 255, 0.1));
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .feature-icon svg {
            width: 28px;
            height: 28px;
            stroke: var(--purple-primary);
        }

        .feature-card h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-dark);
        }

        .feature-card p {
            color: var(--gray-dark);
            font-size: 0.98rem;
            line-height: 1.65;
        }

        /* ===== COMMANDS SECTION ===== */
        .commands-section {
            background: var(--white);
        }

        .commands-tabs {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 48px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: var(--gray-light);
            color: var(--gray-dark);
            border: none;
            padding: 12px 28px;
            border-radius: 100px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .tab-btn:hover {
            background: rgba(123, 47, 190, 0.1);
            color: var(--purple-primary);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--purple-primary), var(--purple-light));
            color: var(--white);
            box-shadow: 0 4px 14px rgba(123, 47, 190, 0.3);
        }

        .commands-panel {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .commands-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .commands-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 16px;
        }

        .command-card {
            background: var(--off-white);
            border: 1px solid rgba(123, 47, 190, 0.08);
            border-radius: var(--radius-sm);
            padding: 24px;
            transition: var(--transition);
        }

        .command-card:hover {
            border-color: rgba(123, 47, 190, 0.25);
            background: var(--white);
            box-shadow: var(--shadow-soft);
        }

        .command-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .command-syntax {
            background: linear-gradient(135deg, rgba(123, 47, 190, 0.08), rgba(199, 125, 255, 0.08));
            color: var(--purple-primary);
            padding: 5px 14px;
            border-radius: 8px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.9rem;
            font-weight: 600;
        }
