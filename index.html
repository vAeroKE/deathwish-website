<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeathWish Bot — The Ultimate Discord Raiding Bot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --purple-50: #faf5ff;
            --purple-100: #f3e8ff;
            --purple-200: #e9d5ff;
            --purple-300: #d8b4fe;
            --purple-400: #c084fc;
            --purple-500: #a855f7;
            --purple-600: #9333ea;
            --purple-700: #7e22ce;
            --purple-800: #6b21a8;
            --purple-900: #581c87;
            --white: #ffffff;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.03);
            --shadow-purple: 0 8px 30px rgba(147, 51, 234, 0.15);
            --shadow-purple-lg: 0 20px 60px rgba(147, 51, 234, 0.2);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--white);
            color: var(--gray-800);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ========== NAVBAR ========== */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--purple-100);
            z-index: 1000;
            padding: 16px 0;
            transition: all 0.3s ease;
        }

        nav.scrolled {
            box-shadow: var(--shadow-md);
            padding: 12px 0;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 22px;
            color: var(--gray-900);
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .nav-logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--purple-500), var(--purple-700));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 20px;
            box-shadow: var(--shadow-purple);
        }

        .nav-logo span {
            background: linear-gradient(135deg, var(--purple-600), var(--purple-800));
            -webkit-background-307: text;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--gray-600);
            font-weight: 500;
            font-size: 15px;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--purple-600);
        }

        .nav-cta {
            background: linear-gradient(135deg, var(--purple-500), var(--purple-700));
            color: var(--white) !important;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 600;
            box-shadow: var(--shadow-purple);
            transition: all 0.25s ease;
        }

        .nav-cta:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-purple-lg);
            color: var(--white) !important;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 24px;
            color: var(--gray-700);
        }

        /* ========== HERO ========== */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 24px 80px;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
        }

        .hero-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
        }

        .hero-blob-1 {
            width: 500px;
            height: 500px;
            background: var(--purple-400);
            top: -100px;
            right: -100px;
            animation: blobFloat 12s ease-in-out infinite;
        }

        .hero-blob-2 {
            width: 400px;
            height: 400px;
            background: var(--purple-300);
            bottom: -80px;
            left: -80px;
            animation: blobFloat 14s ease-in-out infinite reverse;
        }

        .hero-blob-3 {
            width: 300px;
            height: 300px;
            background: var(--purple-200);
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: blobFloat 10s ease-in-out infinite;
            opacity: 0.25;
        }

        @keyframes blobFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.05); }
            66% { transform: translate(-20px, 30px) scale(0.95); }
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 720px;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--purple-50);
            border: 1px solid var(--purple-200);
            color: var(--purple-700);
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 28px;
        }

        .hero-badge-dot {
            width: 8px;
            height: 8px;
            background: var(--purple-500);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        .hero h1 {
            font-size: clamp(40px, 7vw, 76px);
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -2px;
            color: var(--gray-900);
            margin-bottom: 24px;
        }

        .hero h1 .gradient-text {
            background: linear-gradient(135deg, var(--purple-500), var(--purple-800));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: clamp(17px, 2.5vw, 21px);
            color: var(--gray-600);
            max-width: 560px;
            margin: 0 auto 40px;
            line-height: 1.65;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--purple-500), var(--purple-700));
            color: var(--white);
            padding: 16px 36px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 17px;
            text-decoration: none;
            box-shadow: var(--shadow-purple);
            transition: all 0.25s ease;
            border: none;
            cursor: pointer;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-purple-lg);
            color: var(--white);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--white);
            color: var(--purple-700);
            padding: 16px 36px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 17px;
            text-decoration: none;
            border: 2px solid var(--purple-200);
            transition: all 0.25s ease;
        }

        .btn-secondary:hover {
            border-color: var(--purple-500);
            background: var(--purple-50);
            transform: translateY(-2px);
        }

        .hero-stats {
            display: flex;
            gap: 48px;
            justify-content: center;
            margin-top: 64px;
            flex-wrap: wrap;
        }

        .hero-stat {
            text-align: center;
        }

        .hero-stat-number {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--purple-500), var(--purple-700));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .hero-stat-label {
            font-size: 14px;
            color: var(--gray-500);
            font-weight: 500;
            margin-top: 4px;
        }

        /* ========== SECTION GENERAL ========== */
        section {
            padding: 100px 24px;
        }

        .section-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 64px;
        }

        .section-tag {
            display: inline-block;
            background: var(--purple-50);
            color: var(--purple-600);
            font-size: 14px;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 100px;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .section-header h2 {
            font-size: clamp(32px, 5vw, 48px);
            font-weight: 800;
            color: var(--gray-900);
            letter-spacing: -1.5px;
            margin-bottom: 16px;
        }

        .section-header p {
            font-size: 18px;
            color: var(--gray-500);
            max-width: 560px;
            margin: 0 auto;
        }

        /* ========== FEATURES ========== */
        .features {
            background: var(--gray-50);
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 28px;
        }

        .feature-card {
            background: var(--white);
            border-radius: 20px;
            padding: 36px 32px;
            border: 1px solid var(--gray-200);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--purple-400), var(--purple-600));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-purple-lg);
            border-color: var(--purple-200);
        }

        .feature-card:hover::before {
            transform: scaleX(1);
        }

        .feature-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--purple-100), var(--purple-200));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-bottom: 24px;
        }

        .feature-card h3 {
            font-size: 20px;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 10px;
        }

        .feature-card p {
            font-size: 15px;
            color: var(--gray-500);
            line-height: 1.6;
        }

        /* ========== COMMANDS ========== */
        .commands-section {
            background: var(--white);
        }

        .commands-tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 48px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 10px 24px;
            border-radius: 10px;
            border: 2px solid var(--gray-200);
            background: var(--white);
            color: var(--gray-600);
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .tab-btn:hover {
            border-color: var(--purple-300);
            color: var(--purple-600);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--purple-500), var(--purple-700));
            color: var(--white);
            border-color: transparent;
            box-shadow: var(--shadow-purple);
        }

        .commands-panel {
            display: none;
        }

        .commands-panel.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
